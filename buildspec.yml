
version: 0.2

phases:
  pre_build:
    commands:
      - echo Creating CodeBuild log group if permitted
      - |
        aws logs create-log-group \
          --log-group-name /aws/codebuild/authentication-api-build \
          --region ap-south-1 2>/dev/null || true

      - echo Checking ECR repository
      - |
        aws ecr describe-repositories \
          --repository-names authentication-api \
          --region ap-south-1 >/dev/null 2>&1 || \
        aws ecr create-repository \
          --repository-name authentication-api \
          --image-tag-mutability MUTABLE \
          --image-scanning-configuration scanOnPush=true \
          --region ap-south-1

      - REPOSITORY_URI=$(aws ecr describe-repositories --repository-names authentication-api --region ap-south-1 --query 'repositories[0].repositoryUri' --output text)
      - echo Logging in to Amazon ECR
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin "$REPOSITORY_URI"
      - IMAGE_TAG=$CODEBUILD_RESOLVED_SOURCE_VERSION

  build:
    commands:
      - echo Building Docker image
      - docker build -t "$REPOSITORY_URI:$IMAGE_TAG" .
      - docker tag "$REPOSITORY_URI:$IMAGE_TAG" "$REPOSITORY_URI:latest"

  post_build:
    commands:
      - echo Pushing Docker image to ECR
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$REPOSITORY_URI:latest"
      - printf '[{"name":"authentication-api","imageUri":"%s"}]' "$REPOSITORY_URI:$IMAGE_TAG" > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
