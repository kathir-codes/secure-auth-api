AWSTemplateFormatVersion: '2010-09-09'
Description: Authentication API CI/CD pipeline
#------------------ create code build role ------------------------------------
Resources:
  
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: Meyi Learnings
        - Key: CreatedBy
          Value: kathir
        - Key: aws-apn-id
          Value: 'pc:eyl8vo7kcwv8k9qctzbathhiq'


  AuthApiCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser

      Policies:
        - PolicyName: CodeBuildLogsAndArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:kathir-log:log-stream:*'

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub '${ArtifactBucket.Arn}/*'
#----------------------- create code build -----------------------------------
  AuthApiBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: kathir-authentication-api-build
      ServiceRole: !GetAtt AuthApiCodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ECR_REPOSITORY_URI
            Value:
              Fn::ImportValue: AuthApi-RepositoryUri
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: kathir-log
      Tags:
        - Key: Project
          Value: Meyi Learnings
        - Key: CreatedBy
          Value: kathir
        - Key: aws-apn-id
          Value: 'pc:eyl8vo7kcwv8k9qctzbathhiq'
# --------------- AWS + Github --------------------
  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: kathir-github-connection
      ProviderType: GitHub
# --------------- create code pipeline role -------
  AuthApiCodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: AuthApiPipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Start and monitor CodeBuild
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt AuthApiBuildProject.Arn

              # Access the S3 artifact bucket
              - Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:GetBucketAcl
                  - s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:PutObjectAcl
                Resource: !Sub '${ArtifactBucket.Arn}/*'

              # Use the GitHub connection
              - Effect: Allow
                Action:
                  - codeconnections:UseConnection
                Resource: !Ref GitHubConnection 

              # Full ECS permissions
              - Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:DescribeClusters
                Resource: '*'
              

              - Effect: Allow
                Action:
                  - ecs:TagResource
                Resource: '*'
                Condition:
                  StringEquals:
                    ecs:CreateAction: RegisterTaskDefinition


              - Effect: Allow
                Action:
                  - ecs:UpdateService
                Resource:
                  Fn::Sub:
                    - 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${ClusterName}/${ServiceName}'
                    - ClusterName:
                        Fn::ImportValue: AuthApi-ECSClusterName
                      ServiceName:
                        Fn::ImportValue: AuthApi-ServiceName


              # Allow passing the ECS task execution role
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  Fn::ImportValue: AuthApi-TaskExecutionRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
#--------------- create code pipeline ----------------------------
  AuthApiPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: kathir-auth-api-pipeline
      RoleArn: !GetAtt AuthApiCodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: kathir-codes/secure-auth-api
                BranchName: main
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact

        - Name: Build
          Actions:
            - Name: BuildAndPushImage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref AuthApiBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact

        - Name: Deploy
          Actions:
            - Name: DeployToECS
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: '1'
              Configuration:
                ClusterName:
                  Fn::ImportValue: AuthApi-ECSClusterName
                ServiceName:
                  Fn::ImportValue: AuthApi-ServiceName
                FileName: imagedefinitions.json
              InputArtifacts:
                - Name: BuildArtifact

Outputs:
  PipelineName:
    Value: !Ref AuthApiPipeline

  BuildProjectName:
    Value: !Ref AuthApiBuildProject

  GitHubConnectionArn:
    Value: !Ref GitHubConnection