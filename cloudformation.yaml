
AWSTemplateFormatVersion: '2010-09-09'

Description: Authentication API - ECS Deployment

Resources:

  AuthApiCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: authentication-api-cluster-new

  AuthApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: authentication-api-task-new
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: arn:aws:iam::369606757523:role/ecsTaskExecutionRole

      ContainerDefinitions:
        - Name: authentication-api
          Image: 369606757523.dkr.ecr.ap-south-1.amazonaws.com/authentication-api:latest
          Essential: true

          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp

          Environment:
            - Name: DB_HOST
              Value: aws-0-ap-northeast-1.pooler.supabase.com
            - Name: DB_PORT
              Value: '5432'
            - Name: DB_NAME
              Value: postgres
            - Name: DB_USER
              Value: REPLACE_WITH_DB_USER

          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: REPLACE_WITH_DB_PASSWORD_SECRET_ARN
            - Name: JWT_SECRET
              ValueFrom: REPLACE_WITH_JWT_SECRET_ARN
            - Name: GITHUB_CLIENT_SECRET
              ValueFrom: REPLACE_WITH_GITHUB_SECRET_ARN

          Environment:
            - Name: GITHUB_CLIENT_ID
              Value: REPLACE_WITH_GITHUB_CLIENT_ID

          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: /ecs/authentication-api
              awslogs-region: ap-south-1
              awslogs-stream-prefix: ecs

  AuthApiService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: authentication-api-service-new
      Cluster: !Ref AuthApiCluster
      TaskDefinition: !Ref AuthApiTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE

      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets:
            - subnet-0767a6941f954fa86
          SecurityGroups:
            - sg-038cea6c02d85215b

Outputs:

  ECRRepositoryURI:
    Description: ECR repository URI created by CodeBuild
    Value: 369606757523.dkr.ecr.ap-south-1.amazonaws.com/authentication-api

  ECSClusterName:
    Description: ECS cluster name
    Value: !Ref AuthApiCluster

  ECSTaskDefinitionArn:
    Description: ECS task definition ARN
    Value: !Ref AuthApiTaskDefinition

  ECSServiceName:
    Description: ECS service name
    Value: !GetAtt AuthApiService.Name
