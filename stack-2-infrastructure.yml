AWSTemplateFormatVersion: '2010-09-09'
Description: Authentication API CI/CD pipeline

Resources:
  AuthApiCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPowerUser
      Policies:
        - PolicyName: CodeBuildLogsAndArtifacts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: arn:aws:s3:::codepipeline-ap-south-1-d60f41c3c545-49e7-92fe-872d172a623d/*

  AuthApiBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: kathir-authentication-api-build
      ServiceRole: !GetAtt AuthApiCodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ECR_REPOSITORY_URI
            Value:
              Fn::ImportValue: AuthApi-RepositoryUri
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: kathir-log
      Tags:
        - Key: Project
          Value: Meyi Learnings
        - Key: CreatedBy
          Value: kathir
        - Key: aws-apn-id
          Value: 'pc:eyl8vo7kcwv8k9qctzbathhiq'

  GitHubConnection:
    Type: AWS::CodeStarConnections::Connection
    Properties:
      ConnectionName: kathir-github-connection
      ProviderType: GitHub

  AuthApiCodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole

      Policies:
        - PolicyName: AuthApiPipelineAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Start and monitor CodeBuild
              - Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt AuthApiBuildProject.Arn

              # Access the S3 artifact bucket
              - Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: arn:aws:s3:::codepipeline-ap-south-1-d60f41c3c545-49e7-92fe-872d172a623d

              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: arn:aws:s3:::codepipeline-ap-south-1-d60f41c3c545-49e7-92fe-872d172a623d/*

              # Use the GitHub connection
              - Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource: !Ref GitHubConnection

              # Full ECS permissions
              - Effect: Allow
                Action:
                  - ecs:*
                Resource: '*'

              # Allow passing the ECS task execution role
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  Fn::ImportValue: AuthApi-TaskExecutionRoleArn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
  AuthApiPipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: kathir-auth-api-pipeline
      RoleArn: !GetAtt AuthApiCodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: codepipeline-ap-south-1-d60f41c3c545-49e7-92fe-872d172a623d
      Stages:
        - Name: Source
          Actions:
            - Name: GitHubSource
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref GitHubConnection
                FullRepositoryId: kathir-codes/secure-auth-api
                BranchName: main
                OutputArtifactFormat: CODE_ZIP
              OutputArtifacts:
                - Name: SourceArtifact

        - Name: Build
          Actions:
            - Name: BuildAndPushImage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref AuthApiBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact

        - Name: Deploy
          Actions:
            - Name: DeployToECS
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: '1'
              Configuration:
                ClusterName:
                  Fn::ImportValue: AuthApi-ECSClusterName
                ServiceName:
                  Fn::ImportValue: AuthApi-ServiceName
                FileName: imagedefinitions.json
              InputArtifacts:
                - Name: BuildArtifact

Outputs:
  PipelineName:
    Value: !Ref AuthApiPipeline

  BuildProjectName:
    Value: !Ref AuthApiBuildProject

  GitHubConnectionArn:
    Value: !Ref GitHubConnection